name: Website v1.2 Lighthouse
on:
  push:
    branches: [chatgpt/website-v12]
    paths:
      - .github/workflows/website-v12-qa.yml
      - '**/*.html'
      - 'assets/v12/**'
      - 'styles/**'
      - 'scripts/**'
      - releases.json
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mobile Lighthouse
        run: |
          set -euo pipefail
          export CHROME_PATH="$(command -v google-chrome)"
          npm install --prefix "$RUNNER_TEMP/website-qa" lighthouse@13.0.3
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/website-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --silent --fail http://127.0.0.1:8765/ -o /dev/null
          for page in home features help download privacy; do
            route="$page/"
            if [ "$page" = home ]; then route=""; fi
            "$RUNNER_TEMP/website-qa/node_modules/.bin/lighthouse" "http://127.0.0.1:8765/$route" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox" --quiet \
              --output=json --output-path="$RUNNER_TEMP/$page.json"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          passes = True
          for page in ("home", "features", "help", "download", "privacy"):
              report = json.loads((Path(os.environ["RUNNER_TEMP"]) / f"{page}.json").read_text())
              scores = {
                  key: None if category["score"] is None else round(category["score"] * 100)
                  for key, category in report["categories"].items()
              }
              print(page, scores)
              audits = report['audits']
              keys = ('first-contentful-paint', 'largest-contentful-paint', 'speed-index', 'total-blocking-time', 'cumulative-layout-shift', 'mainthread-work-breakdown', 'render-blocking-insight', 'lcp-breakdown-insight')
              for key in keys:
                  if key in audits:
                      audit = audits[key]
                      print(key, audit.get('displayValue', ''), audit.get('errorMessage', ''))
                      if key in ('mainthread-work-breakdown', 'lcp-breakdown-insight', 'render-blocking-insight'):
                          print(json.dumps(audit.get('details', {}))[:2500])
              passes &= all(score is not None and score >= 90 for score in scores.values())
          raise SystemExit(0 if passes else 1)
          PY
