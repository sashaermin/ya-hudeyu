name: САЙТ — проверки и Telegram
on:
  push:
    branches: ['work/**']
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate Russian report metadata (AGENT_NOTIFICATION_PROTOCOL.md)
        run: python3 .github/scripts/telegram_notify.py report-check
      - name: Verify notification script
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate registries
        run: |
          python3 .github/scripts/telegram_notify.py actions
          python3 .github/scripts/telegram_notify.py events
      - name: Website build
        run: python3 tools/build.py
      - name: Website regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript syntax
        run: |
          node --check scripts/theme.js
          node --check scripts/site.js
      - name: Package protected draft for review
        run: python3 tools/package_preview.py
      - name: Save review archive (no website deployment)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        with:
          name: website-preview-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .test-results/release-candidate/website-preview.zip
            .test-results/release-candidate/website-preview.manifest.json
          if-no-files-found: error
          include-hidden-files: true # Only the two explicit review files above.
          retention-days: 7
      - name: Download the stored review artifact for round-trip verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node24
        with:
          name: website-preview-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .test-results/downloaded-preview
      - name: Verify stored archive and actual rendered candidate
        run: |
          python3 -m venv .test-results/preview-qa-venv
          .test-results/preview-qa-venv/bin/python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          preview_browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          .test-results/preview-qa-venv/bin/python tests/review_artifact_qa.py .test-results/downloaded-preview/website-preview.zip --checkpoint '${{ github.sha }}' --executable "$preview_browser" --output .test-results/review-artifact.json
      - name: Verify published website over HTTPS (read-only, normal TLS trust)
        if: "contains(github.event.head_commit.message, 'Verify-Live-Production: true')"
        run: |
          production_browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          .test-results/preview-qa-venv/bin/python tests/production_qa.py --executable "$production_browser"
      - name: Measure mobile production Lighthouse (read-only)
        if: "contains(github.event.head_commit.message, 'Verify-Live-Production: true')"
        run: |
          npm ci --prefix tools/qa --ignore-scripts --no-audit --no-fund
          production_browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          CHROME_PATH="$production_browser" tools/qa/node_modules/.bin/lighthouse https://yahudeyu-app.ru/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=.test-results/production/lighthouse.json --quiet
          python3 tools/qa/summarize_lighthouse.py .test-results/production/lighthouse.json
      - name: Save review verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node24
        with:
          name: website-preview-verification-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .test-results/review-artifact.json
            .test-results/production/production-results.json
            .test-results/production/browser-results.json
            .test-results/production/lighthouse.json
            .test-results/production/lighthouse.summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  notify:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check Telegram bindings without exposing values
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/telegram_notify.py check-config
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .telegram-ledger
          key: website-telegram-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: website-telegram-${{ github.ref }}-
      # Formatting/provenance/dedup: AGENT_NOTIFICATION_PROTOCOL.md; handoff: AGENT_DEVELOPMENT_PROTOCOL.md.
      - name: Report verified commits and registered events
        if: needs.verify.result == 'success'
        env:
          WEBSITE_CHECK_STATUS: ${{ needs.verify.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/telegram_notify.py commits --ledger .telegram-ledger/sent.txt
      - name: Report meaningful verification failure
        if: needs.verify.result != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSITE_CHECK_STATUS: ${{ needs.verify.result }}
        run: python3 .github/scripts/telegram_notify.py ci-report --workflow 'САЙТ — проверки' --status "$WEBSITE_CHECK_STATUS"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always()
        with:
          path: .telegram-ledger
          key: website-telegram-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
