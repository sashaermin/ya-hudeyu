# Prepared on the development branch. GitHub schedules activate only on default branch.
# Do not move this workflow into main without the owner's separate authorization.
name: САЙТ — ежедневный отчёт
on:
  schedule:
    - cron: '0 18 * * *' # 21:00 Europe/Moscow (UTC+3); GitHub may delay scheduled jobs.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: website-daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: work/website-v2
          persist-credentials: false
      - name: Test deterministic digest and notification code
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check Telegram bindings
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 .github/scripts/telegram_notify.py check-config
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .telegram-ledger
          key: website-digest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: website-digest-
      - name: Send website digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/telegram_notify.py digest --branch work/website-v2 --ledger .telegram-ledger/digest.txt
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always()
        with:
          path: .telegram-ledger
          key: website-digest-${{ github.run_id }}-${{ github.run_attempt }}
