name: Capture Android installation settings
on:
  push:
    branches: [chatgpt/website-v12]
    paths: [.github/workflows/website-install-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Start a disposable Android 14 emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          image='system-images;android-34;google_apis;x86_64'
          sdkmanager "emulator" "platform-tools" "$image"
          printf 'no\n' | avdmanager create avd --name website-guide --package "$image" --force
          emulator -avd website-guide -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          timeout 220 adb wait-for-device
          for attempt in $(seq 1 80); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell wm size 720x1280
          adb shell wm density 300
          mkdir -p "$RUNNER_TEMP/guide"
          adb shell am start -W -a android.settings.MANAGE_UNKNOWN_APP_SOURCES
          sleep 2
          adb shell uiautomator dump /sdcard/guide.xml
          adb shell cat /sdcard/guide.xml | python3 -c 'import sys,xml.etree.ElementTree as x; print([n.get("text") for n in x.fromstring(sys.stdin.read()).iter("node") if n.get("text")])'
          adb exec-out screencap -p > "$RUNNER_TEMP/guide/sources.png"
          for source in com.android.chrome com.google.android.documentsui com.android.documentsui com.android.vending; do
            if adb shell dumpsys package "$source" | grep 'android.permission.REQUEST_INSTALL_PACKAGES' > /dev/null; then
              adb shell am start -W -a android.settings.MANAGE_UNKNOWN_APP_SOURCES -d "package:$source"
              sleep 2
              adb shell uiautomator dump /sdcard/guide.xml
              adb shell cat /sdcard/guide.xml | python3 -c 'import sys,xml.etree.ElementTree as x; print([n.get("text") for n in x.fromstring(sys.stdin.read()).iter("node") if n.get("text")])'
              adb exec-out screencap -p > "$RUNNER_TEMP/guide/source-permission.png"
              break
            fi
          done
      - name: Upload Android settings screenshots
        uses: actions/upload-artifact@v4
        with:
          name: android-install-settings
          path: ${{ runner.temp }}/guide/*.png
          if-no-files-found: error
          retention-days: 2
